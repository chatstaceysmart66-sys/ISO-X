<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ISO-X Azure Dragon desktop</title>
  <desc id="desc">A restrained midnight-blue desktop with the ISO-X dragon mark as its single focal point.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030812"/>
      <stop offset=".52" stop-color="#08172A"/>
      <stop offset="1" stop-color="#02060D"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#075AA0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#031020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#night)"/>
  <ellipse cx="960" cy="510" rx="730" ry="455" fill="url(#aura)"/>
  <path d="M0 888Q480 818 960 886T1920 860V1080H0Z" fill="#030914" opacity=".7"/>
  <path d="M0 926Q480 866 960 925T1920 904" fill="none" stroke="#0A5790" stroke-opacity=".28" stroke-width="2"/>
  <image x="590" y="85" width="740" height="850" href="iso-x-dragon.svg" preserveAspectRatio="xMidYMid meet"/>
  <text x="88" y="1000" fill="#A9EFFF" font-family="DejaVu Sans,sans-serif" font-size="24" letter-spacing="9" opacity=".78">ISO-X</text>
</svg>
