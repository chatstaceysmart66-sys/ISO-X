<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ISO-X Azure Dragon desktop</title>
  <desc id="desc">A midnight-blue desktop with a clear Arabic-first welcome area, subtle circuitry, and the ISO-X dragon mark.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050914"/>
      <stop offset=".52" stop-color="#0A1B31"/>
      <stop offset="1" stop-color="#030711"/>
    </linearGradient>
    <radialGradient id="aura" cx=".62" cy=".4" r=".58">
      <stop stop-color="#087FC4" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#06345C" stop-opacity=".16"/>
      <stop offset="1" stop-color="#031020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38D9FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1769E8" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#42B8FF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#night)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1230" cy="430" rx="690" ry="520" fill="url(#aura)"/>
  <circle cx="1285" cy="480" r="390" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".42"/>
  <circle cx="1285" cy="480" r="430" fill="none" stroke="#38D9FF" stroke-opacity=".12" stroke-width="1"/>
  <path d="M0 835C290 744 488 802 704 855s438 46 610-24 382-77 606-9v258H0Z" fill="#030914" opacity=".78"/>
  <path d="M0 886C290 794 488 852 704 905s438 46 610-24 382-77 606-9" fill="none" stroke="#0A5790" stroke-opacity=".36" stroke-width="2"/>
  <path d="M1330 105 1450 105 1510 165 1680 165M1460 220h120l46 46h166M1455 770h132l66-66h165M1515 856h110l54-54h139" fill="none" stroke="#27C9F5" stroke-opacity=".19" stroke-width="2"/>
  <g fill="#4DE7FF" fill-opacity=".4">
    <circle cx="1450" cy="105" r="4"/><circle cx="1680" cy="165" r="4"/>
    <circle cx="1792" cy="266" r="4"/><circle cx="1818" cy="704" r="4"/>
    <circle cx="1455" cy="770" r="4"/><circle cx="1818" cy="802" r="4"/>
  </g>
  <image x="1000" y="94" width="620" height="742" href="iso-x-dragon.svg" preserveAspectRatio="xMidYMid meet"/>
  <g font-family="Noto Sans Arabic,DejaVu Sans,sans-serif">
    <text x="150" y="412" fill="#55D9FF" font-size="23" letter-spacing="8" opacity=".88">ISO-X  /  DEBIAN LIVE</text>
    <text x="150" y="508" fill="#F2F7FF" font-size="62" font-weight="700">Welcome to ISO-X</text>
    <text x="153" y="566" fill="#B3C9E2" font-size="27">A clear desktop, ready to explore</text>
    <path d="M153 615h118" stroke="#35C4FF" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="676" fill="#83A6C8" font-size="20" letter-spacing="3">ARABIC FIRST  ·  OPEN SOURCE  ·  YOUR DESKTOP</text>
  </g>
  <path d="M150 748h405l28 28v72H150Z" fill="#0B1B2F" fill-opacity=".68" stroke="#35C4FF" stroke-opacity=".2"/>
  <text x="178" y="793" fill="#D7E9F8" font-family="DejaVu Sans,sans-serif" font-size="19">Super</text>
  <text x="244" y="793" fill="#83A6C8" font-family="DejaVu Sans,sans-serif" font-size="18">Open the app lens</text>
  <text x="178" y="838" fill="#D7E9F8" font-family="DejaVu Sans,sans-serif" font-size="19">Alt + Shift</text>
  <text x="288" y="838" fill="#83A6C8" font-family="DejaVu Sans,sans-serif" font-size="18">Switch keyboard language</text>
</svg>
