<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ISO-X Azure Dragon</title>
  <desc id="desc">A luminous blue dragon with a swept wing, two horns, a scaled neck and a clearly defined profile.</desc>
  <defs>
    <linearGradient id="azure" x1=".12" y1=".08" x2=".9" y2=".92">
      <stop stop-color="#8AF7FF"/>
      <stop offset=".38" stop-color="#13D4FF"/>
      <stop offset="1" stop-color="#1769E8"/>
    </linearGradient>
    <linearGradient id="membrane" x1=".1" y1=".1" x2=".9" y2="1">
      <stop stop-color="#153D6C"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="shadow" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#122D4A"/>
      <stop offset="1" stop-color="#06111E"/>
    </linearGradient>
    <filter id="glow" x="-.25" y="-.25" width="1.5" height="1.5">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
