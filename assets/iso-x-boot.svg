<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ISO-X blue dragon boot screen</title>
  <desc id="desc">The ISO-X dragon mark centered on a quiet dark-blue glow.</desc>
  <defs>
    <radialGradient id="bootHalo">
      <stop stop-color="#07518A" stop-opacity=".48"/>
      <stop offset="1" stop-color="#020711" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#020711"/>
  <circle cx="256" cy="256" r="238" fill="url(#bootHalo)"/>
  <image x="24" y="24" width="464" height="464" href="iso-x-dragon.svg" preserveAspectRatio="xMidYMid meet"/>
</svg>
